title = "Bufferize"
gitRepoUrl = "https://github.com/EgoMoose/rbx-bufferize"
gitSourceBranch = "main"
changelog = true
autoSectionPath = "src"

[home]
enabled = true
includeReadMe = false

[[home.features]]
title = "Lossless by default"
description = "Encode and decode the full range of supported Roblox data types into compact buffers without losing precision."

[[home.features]]
title = "Custom encoders"
description = "Override the encoding of any supported data type to trade precision for a smaller buffer size."

[[home.features]]
title = "Instance serialization"
description = "Serialize whole instance trees — including properties, attributes, tags, and internal references — into buffers."

[[home.features]]
title = "Versioned buffers"
description = "Every buffer carries the Bufferize version that wrote it, so decoding across incompatible versions fails fast instead of corrupting data."

